<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bimba Matahari Kecil - Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Halaman login -->
  <div id="loginGate" class="d-none">
    <div class="pin-card">
      <div class="brand-icon"><i class="bi bi-sun-fill"></i></div>
      <h5 class="fw-bold mb-1">Bimba Matahari Kecil</h5>
      <p class="text-muted small mb-3">Silakan masuk sesuai akun Anda</p>
      <input type="text" id="loginUser" class="form-control mb-2" placeholder="Username" autocomplete="username">
      <input type="password" id="loginPass" class="form-control mb-2" placeholder="Password" autocomplete="current-password">
      <input type="text" id="loginApiUrl" class="form-control form-control-sm mb-2" placeholder="URL API (opsional, isi jika belum terhubung)">
      <button class="btn btn-warning w-100 fw-bold" onclick="doLogin()">Masuk</button>
      <div id="loginError" class="text-danger small mt-2 d-none"></div>
      <div class="text-muted small mt-3">Akun default: <code>admin</code> / <code>admin123</code></div>
    </div>
  </div>

  <div id="app" class="d-none">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-sun-fill"></i>
        <div>
          <div class="fw-bold">Bimba Matahari Kecil</div>
          <small>Temani Tumbuh, Temani Bersinar</small>
        </div>
      </div>
      <nav id="mainNav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="nav-btn w-100" data-module="pengaturan"><i class="bi bi-gear"></i> Pengaturan</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar d-md-none">
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <span class="fw-bold ms-2" id="topbarTitle">Dashboard</span>
      </header>
      <main id="content" class="p-3 p-md-4"></main>
    </div>
  </div>

  <!-- Modal form generik -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formModalTitle">Form</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="formModalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-warning fw-bold" id="formModalSave" onclick="saveForm()"><i class="bi bi-save"></i> Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal konfirmasi hapus -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
          <p class="mt-2 mb-3">Hapus data ini secara permanen?</p>
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-danger" id="deleteConfirmBtn">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal info (ringkasan pengingat dsb.) -->
  <div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="infoModalTitle">Info</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="infoModalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-warning" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastArea" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div id="printArea"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
